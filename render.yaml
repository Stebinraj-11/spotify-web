services:
  - type: web
    name: spotify-web-player
    env: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: spotify-music-disk
      mountPath: /var/data
      sizeGB: 5
